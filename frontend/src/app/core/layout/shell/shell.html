<header class="sticky top-0 z-10 border-b border-surface-200 bg-surface-0 dark:border-surface-800 dark:bg-surface-950">
  <div class="mx-auto flex h-14 w-full max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <a routerLink="/" class="text-lg font-semibold" (click)="cerrarMenu()">Creditos</a>

    <!-- Menú escritorio -->
    <nav class="hidden gap-6 md:flex" aria-label="Principal">
      @for (item of navItems; track item.label) {
        <a [routerLink]="item.route" routerLinkActive="text-primary font-semibold" class="hover:text-primary">
          {{ item.label }}
        </a>
      }
    </nav>

    <!-- Botón hamburguesa (solo celular/tablet) -->
    <button
      type="button"
      class="rounded p-2 hover:bg-surface-100 md:hidden dark:hover:bg-surface-800"
      [attr.aria-expanded]="menuAbierto()"
      aria-controls="menu-movil"
      aria-label="Abrir menú"
      (click)="toggleMenu()"
    >
      <svg class="size-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        @if (menuAbierto()) {
          <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
        } @else {
          <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
        }
      </svg>
    </button>
  </div>

  <!-- Menú celular -->
  @if (menuAbierto()) {
    <nav id="menu-movil" class="border-t border-surface-200 px-4 py-2 md:hidden dark:border-surface-800" aria-label="Principal">
      @for (item of navItems; track item.label) {
        <a
          [routerLink]="item.route"
          routerLinkActive="text-primary font-semibold"
          class="block rounded px-2 py-3 hover:bg-surface-100 dark:hover:bg-surface-800"
          (click)="cerrarMenu()"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  }
</header>

<main class="mx-auto w-full max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
  <router-outlet />
</main>
