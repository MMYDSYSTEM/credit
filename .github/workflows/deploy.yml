# Publica Angular SIN SSR (CSR: renderizado en el navegador) en GitHub Pages.
# El proyecto Angular está en la carpeta frontend/.
# Guárdalo como .github/workflows/deploy.yml (usa solo uno de los dos archivos: CSR o SSR).

name: Publicar Angular (CSR) en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular
        # El sitio vive en https://<usuario>.github.io/<repositorio>/
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      - name: Preparar sitio
        id: salida
        run: |
          # Busca index.html dentro de dist/ (dist/<proyecto>/browser o dist/<proyecto>)
          INDEX=$(find dist -name index.html | head -n 1)
          if [ -z "$INDEX" ]; then
            echo "No se encontró index.html en dist/. Estructura generada:"
            ls -R dist | head -50
            exit 1
          fi
          CARPETA=$(dirname "$INDEX")
          echo "Carpeta que se publicará: frontend/$CARPETA"

          # GitHub Pages muestra 404.html en rutas que no existen como archivo;
          # al ser una copia de index.html, Angular arranca y abre la pantalla correcta.
          cp "$INDEX" "$CARPETA/404.html"
          echo "carpeta=frontend/$CARPETA" >> "$GITHUB_OUTPUT"

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.salida.outputs.carpeta }}

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: publicacion
        uses: actions/deploy-pages@v4
