# Publica SOLO la carpeta frontend/ (Angular) en GitHub Pages.
# La carpeta backend/ no se compila ni se publica.
# La carpeta compilada se detecta sola dentro de frontend/dist/.

name: Publicar Angular en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'                   # solo se ejecuta si cambió algo de Angular
      - '.github/workflows/deploy.yml'
  workflow_dispatch:                    # permite publicar a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend     # todos los comandos se ejecutan dentro de frontend/
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular
        # El sitio vive en https://<usuario>.github.io/<repositorio>/
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      - name: Preparar rutas de Angular
        id: salida
        # Busca la carpeta compilada sin importar cómo esté configurado outputPath en angular.json.
        # GitHub Pages muestra 404.html en rutas que no existen como archivo;
        # al ser una copia de index.html, Angular arranca y abre la pantalla correcta.
        run: |
          echo "Contenido de dist/:"
          find dist -maxdepth 3 -name "index*.html"

          INDEX=$(find dist -name index.html -not -path "*/server/*" | head -n 1)

          # Proyectos con SSR generan index.csr.html en lugar de index.html
          if [ -z "$INDEX" ]; then
            CSR=$(find dist -name index.csr.html -not -path "*/server/*" | head -n 1)
            if [ -n "$CSR" ]; then
              INDEX="$(dirname "$CSR")/index.html"
              cp "$CSR" "$INDEX"
              echo "Se usó index.csr.html (proyecto con SSR)"
            fi
          fi

          if [ -z "$INDEX" ]; then
            echo "No se encontró index.html dentro de dist/. Estructura generada:"
            ls -R dist | head -50
            exit 1
          fi

          CARPETA=$(dirname "$INDEX")
          echo "Carpeta que se publicará: frontend/$CARPETA"
          cp "$INDEX" "$CARPETA/404.html"
          echo "carpeta=frontend/$CARPETA" >> "$GITHUB_OUTPUT"

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.salida.outputs.carpeta }}

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: publicacion
        uses: actions/deploy-pages@v4
